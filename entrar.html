<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Entrar — Los Caseritos</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%20100%20100'%20width='100'%20height='100'%3E%3Crect%20width='100'%20height='100'%20rx='22'%20fill='%230a7d54'/%3E%3Cg%20transform='translate(50,50)%20scale(.8)%20translate(-50,-46)'%3E%3Cmask%20id='mFav'%3E%3Crect%20width='100'%20height='100'%20fill='black'/%3E%3Cpath%20d='M50.0%20-1.0Q58.3%2015.1%2070.0%2011.4Q73.5%2022.5%2088.5%2023.8Q81.4%2037.6%2091.5%2046.0Q80.2%2054.1%2090.7%2069.5Q72.6%2068.6%2070.0%2080.6Q58.6%2078.1%2050.0%2090.5Q41.6%2077.4%2029.3%2081.9Q27.9%2068.1%209.3%2069.5Q19.1%2054.3%2010.0%2046.0Q17.9%2037.4%2011.5%2023.8Q27.0%2023.0%2029.2%2010.1Q41.9%2015.8%2050.0%20-1.0Z'%20fill='white'/%3E%3Cpath%20d='M50%2011a37%2037%200%201%200%20.01%200Z'%20fill='black'/%3E%3Cpath%20d='M50%2016a32%2032%200%201%201-.01%200Z'%20fill='white'/%3E%3Cpath%20d='M22%2032a9%209%200%200%201%2013-9l3%2012Z%20M78%2032a9%209%200%200%200-13-9l-3%2012Z'%20fill='white'/%3E%3Cpath%20d='M29%2038L45%2045L41%2052C33%2052%2029%2046%2029%2038ZM71%2038L55%2045L59%2052C67%2052%2071%2046%2071%2038Z'%20fill='black'/%3E%3Cpath%20d='M41%2057H59Q59%2068%2050%2071Q41%2068%2041%2057Z'%20fill='black'/%3E%3C/mask%3E%3Crect%20width='100'%20height='100'%20fill='%23ffffff'%20mask='url(%23mFav)'/%3E%3C/g%3E%3C/svg%3E">
<style>
  :root{
    --bg:#0a140f; --surface:#11201a; --surface-2:#183026;
    --ink:#eaf5ee; --ink-soft:#9fb6a8; --line:#223a2e;
    --green:#2fd08f; --coral:#ff8378;
    --grad:linear-gradient(135deg,#2fd08f,#12946a);
    --f-display:"Trebuchet MS","Segoe UI",system-ui,sans-serif;
    --f-body:"Segoe UI",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:24px;
    background:
      radial-gradient(900px 500px at 100% -10%, rgba(43,208,194,.16), transparent 60%),
      radial-gradient(700px 460px at -10% 0%, rgba(47,208,143,.13), transparent 55%),
      var(--bg);
    color:var(--ink);font-family:var(--f-body)}
  .caja{width:min(400px,100%);background:var(--surface);border:1px solid var(--line);
    border-radius:22px;padding:32px 26px;box-shadow:0 18px 50px rgba(0,0,0,.5)}
  .marca{display:flex;flex-direction:column;align-items:center;gap:12px;margin-bottom:26px}
  .marca .ic{width:62px;height:62px;border-radius:20px;background:var(--grad);
    display:grid;place-items:center;box-shadow:0 8px 22px rgba(47,208,143,.3)}
  .marca .ic svg{width:40px;height:40px;display:block}
  .marca b{font-family:var(--f-display);font-size:1.35rem;letter-spacing:-.02em}
  .marca b span{color:var(--green)}
  .marca small{color:var(--ink-soft);font-size:.72rem;letter-spacing:.13em;text-transform:uppercase;font-weight:700}

  label{display:block;font-size:.72rem;font-weight:800;color:var(--ink-soft);
    text-transform:uppercase;letter-spacing:.08em;margin:0 0 6px}
  .campo{margin-bottom:16px}
  input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:12px;
    padding:14px 15px;color:var(--ink);font-family:var(--f-body);font-size:1rem;outline:none}
  input:focus{border-color:var(--green)}
  .clave-caja{position:relative}
  .ojo{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:transparent;
    border:0;color:var(--ink-soft);font-size:1.05rem;cursor:pointer;padding:8px 10px;border-radius:9px}
  .ojo:hover{color:var(--ink)}
  button.entrar{width:100%;background:var(--grad);color:#05130d;border:0;border-radius:12px;
    padding:15px;font-family:var(--f-body);font-weight:800;font-size:.98rem;cursor:pointer;margin-top:6px}
  button.entrar:disabled{opacity:.55;cursor:not-allowed}
  .aviso{margin-top:14px;padding:12px 14px;border-radius:11px;font-size:.85rem;font-weight:700;
    background:rgba(255,131,120,.14);border:1px solid rgba(255,131,120,.38);color:var(--coral);display:none}
  .aviso.ver{display:block}
  .pie{margin-top:20px;text-align:center;font-size:.78rem;color:var(--ink-soft)}
  .pie a{color:var(--green);font-weight:700;text-decoration:none}
</style>
</head>
<body>

<main class="caja">
  <div class="marca">
    <span class="ic">
      <svg class="marca-svg" viewBox="0 0 100 100" aria-hidden="true" focusable="false"><g transform="translate(50,50) scale(1) translate(-50,-46)"><mask id="mLeon"><rect width="100" height="100" fill="black"/><path d="M50.0 -1.0Q58.3 15.1 70.0 11.4Q73.5 22.5 88.5 23.8Q81.4 37.6 91.5 46.0Q80.2 54.1 90.7 69.5Q72.6 68.6 70.0 80.6Q58.6 78.1 50.0 90.5Q41.6 77.4 29.3 81.9Q27.9 68.1 9.3 69.5Q19.1 54.3 10.0 46.0Q17.9 37.4 11.5 23.8Q27.0 23.0 29.2 10.1Q41.9 15.8 50.0 -1.0Z" fill="white"/><path d="M50 13a35 35 0 1 0 .01 0Z" fill="black"/><path d="M50 16a32 32 0 1 1-.01 0Z" fill="white"/><path d="M22 32a9 9 0 0 1 13-9l3 12Z M78 32a9 9 0 0 0-13-9l-3 12Z" fill="white"/><path d="M29 38L45 45L41 52C33 52 29 46 29 38ZM71 38L55 45L59 52C67 52 71 46 71 38Z" fill="black"/><path d="M41 57H59Q59 68 50 71Q41 68 41 57Z" fill="black"/><path d="M50 70q-5 6-11 3M50 70q5 6 11 3" fill="none" stroke="black" stroke-width="4" stroke-linecap="round"/></mask><rect width="100" height="100" fill="#ffffff" mask="url(#mLeon)"/></g></svg>
    </span>
    <b>Los <span>Caseritos</span></b>
    <small>Panel de la tienda</small>
  </div>

  <form id="form" autocomplete="on">
    <div class="campo">
      <label for="usuario">Usuario</label>
      <input id="usuario" name="username" autocomplete="username" autocapitalize="none" autocorrect="off" required>
    </div>
    <div class="campo">
      <label for="clave">Contraseña</label>
      <div class="clave-caja">
        <input id="clave" name="password" type="password" autocomplete="current-password" required>
        <button type="button" class="ojo" id="verClave" aria-label="Mostrar contraseña">👁</button>
      </div>
    </div>
    <button type="submit" class="entrar" id="btn">Entrar</button>
    <div class="aviso" id="aviso"></div>
  </form>

  <p class="pie"><a href="./">← Ver la tienda</a></p>
</main>

<script>
const $=id=>document.getElementById(id);
const volver=new URLSearchParams(location.search).get('volver')||'admin.html';

$('verClave').addEventListener('click',()=>{
  const c=$('clave');
  c.type = c.type==='password' ? 'text' : 'password';
  $('verClave').textContent = c.type==='password' ? '👁' : '🙈';
  c.focus();
});

function mostrarAviso(txt){
  const a=$('aviso');
  a.textContent=txt;
  a.classList.add('ver');
}

$('form').addEventListener('submit',async e=>{
  e.preventDefault();
  $('aviso').classList.remove('ver');
  $('btn').disabled=true;
  $('btn').textContent='Entrando…';
  try{
    const r=await fetch('api/login',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({usuario:$('usuario').value,clave:$('clave').value})
    });
    const d=await r.json();
    if(!r.ok) throw new Error(d.error||'No se pudo entrar');
    /* "volver" llega SIN barra inicial y se usa como ruta relativa: así funciona
       igual en la raíz del dominio o en una subcarpeta, y nunca puede mandar al
       visitante a otro sitio */
    location.href = /^[a-zA-Z0-9._/-]+$/.test(volver) && !volver.includes('..')
      ? volver : 'admin.html';
  }catch(err){
    mostrarAviso(err.message);
    $('clave').value=''; $('clave').focus();
  }finally{
    $('btn').disabled=false;
    $('btn').textContent='Entrar';
  }
});

/* si ya había entrado antes, no le hacemos escribir de nuevo */
fetch('api/quien-soy').then(r=>r.json()).then(d=>{
  if(d.dentro) location.href='admin.html';
  if(!d.conLogin) mostrarAviso('Este servidor no usa clave: el panel se abre directo desde esta computadora.');
}).catch(()=>{});

$('usuario').focus();
</script>
</body>
</html>
